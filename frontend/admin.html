<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASADERO KIKOS | CONTROL</title>

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Configuración de Tailwind Brutalista -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FF2A00',
                        secondary: '#FFC800',
                        dark: '#09090b',
                        surface: '#f4f4f0',
                    },
                    fontFamily: {
                        sans: ['Archivo', 'sans-serif'],
                        display: ['Oswald', 'sans-serif'],
                    },
                    boxShadow: {
                        'brutal': '8px 8px 0px 0px rgba(9,9,11,1)',
                        'brutal-sm': '4px 4px 0px 0px rgba(9,9,11,1)',
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Oswald:wght@500;700&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Archivo', sans-serif;
            background-color: #f4f4f0;
        }

        h1,
        h2,
        h3,
        h4,
        .font-display {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
        }

        .spa-view {
            display: none;
        }

        .spa-view.active {
            display: block;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        *:focus-visible {
            outline: 3px solid #FF2A00;
            outline-offset: 2px;
        }
    </style>
</head>

<body
    class="bg-surface text-dark antialiased flex flex-col min-h-screen border-8 border-dark selection:bg-primary selection:text-white">

    <main class="flex-grow w-full">
        <!-- VIEW: ADMIN LOGIN -->
        <section id="view-admin-login"
            class="spa-view bg-surface min-h-screen bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4IiBoZWlnaHQ9IjgiPjxyZWN0IHdpZHRoPSI4IiBoZWlnaHQ9IjgiIGZpbGw9IiNmNGY0ZjAiPjwvcmVjdD48cGF0aCBkPSJNMCAwTDggOFpNOCAwTDAgOFoiIHN0cm9rZT0iI2U1ZTVlNSIgc3Ryb2tlLXdpZHRoPSIxIj48L3BhdGg+PC9zdmc+')]">
            <div class="py-20 min-h-screen flex items-center justify-center w-full">
                <div class="bg-white p-10 border-4 border-dark shadow-brutal w-full max-w-md relative">
                    <div class="absolute -top-4 -left-4 w-8 h-8 bg-primary border-4 border-dark"></div>
                    <div class="text-center mb-10 border-b-4 border-dark pb-6">
                        <h2 class="font-display text-5xl font-extrabold text-primary uppercase">KIKOS</h2>
                        <p
                            class="text-dark font-bold font-display uppercase tracking-widest mt-2 bg-secondary inline-block px-2 border-2 border-dark">
                            Acceso Restringido</p>
                    </div>
                    <form id="login-form" class="space-y-6">
                        <div>
                            <label
                                class="block text-sm font-bold text-dark mb-2 uppercase font-display tracking-widest">Credencial
                                Alfa</label>
                            <input type="email" id="login-email"
                                class="w-full px-4 py-3 border-4 border-dark focus:outline-none focus:ring-0 bg-surface shadow-brutal-sm"
                                required>
                        </div>
                        <div>
                            <label
                                class="block text-sm font-bold text-dark mb-2 uppercase font-display tracking-widest">Clave
                                de Acceso</label>
                            <input type="password" id="login-password"
                                class="w-full px-4 py-3 border-4 border-dark focus:outline-none focus:ring-0 bg-surface shadow-brutal-sm"
                                required>
                        </div>
                        <div id="login-error"
                            class="hidden bg-primary text-white p-3 border-4 border-dark font-bold text-sm"></div>
                        <button type="submit" id="login-btn"
                            class="w-full bg-dark hover:bg-white hover:text-dark text-white border-4 border-dark font-display text-2xl py-4 shadow-brutal hover:shadow-none hover:translate-x-1 hover:translate-y-1 transition-all uppercase">
                            Entrar al Sistema
                        </button>
                    </form>
                </div>
            </div>
        </section>

        <!-- VIEW: ADMIN DASHBOARD -->
        <section id="view-admin-dashboard" class="spa-view bg-surface min-h-screen pb-20">
            <!-- Admin Topbar -->
            <div
                class="bg-dark text-white px-6 py-4 flex flex-col md:flex-row justify-between items-center border-b-4 border-primary">
                <h2 class="font-display text-3xl uppercase tracking-widest"><span class="text-primary">KIKOS</span>
                    CONTROL</h2>
                <div class="flex items-center gap-6 mt-4 md:mt-0">
                    <button id="admin-logout-btn"
                        class="font-display uppercase tracking-widest border-2 border-white px-4 py-1 hover:bg-white hover:text-dark transition-colors">Abortar
                        Misión</button>
                </div>
            </div>

            <div class="max-w-7xl mx-auto px-4 mt-12">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-6">
                    <h3 class="font-display text-5xl font-bold text-dark uppercase">Arsenal de Productos</h3>
                    <button id="btn-add-product"
                        class="bg-primary text-white border-4 border-dark px-6 py-3 font-display text-xl uppercase shadow-brutal hover:shadow-none hover:translate-y-1 transition-all flex items-center gap-2">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path>
                        </svg>
                        Forjar Nuevo
                    </button>
                </div>

                <div class="bg-white border-4 border-dark shadow-brutal overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr
                                class="bg-dark text-white border-b-4 border-dark font-display uppercase tracking-widest text-lg">
                                <th class="p-4 border-r-4 border-dark">Imagen</th>
                                <th class="p-4 border-r-4 border-dark">Nombre</th>
                                <th class="p-4 border-r-4 border-dark">Categoría</th>
                                <th class="p-4 border-r-4 border-dark">Precio</th>
                                <th class="p-4 border-r-4 border-dark">Estado</th>
                                <th class="p-4 text-center">Órdenes</th>
                            </tr>
                        </thead>
                        <tbody id="admin-products-tbody" class="divide-y-4 divide-dark">
                            <tr>
                                <td colspan="6" class="p-8 text-center text-dark font-bold uppercase animate-pulse">
                                    Escaneando base de datos...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <!-- Admin Modal -->
    <div id="admin-modal-overlay"
        class="fixed inset-0 bg-dark/80 backdrop-blur-sm z-50 flex justify-center items-center opacity-0 pointer-events-none transition-opacity duration-300">
        <div id="admin-modal-content"
            class="bg-surface border-4 border-dark shadow-brutal w-full max-w-xl mx-4 transform scale-95 transition-transform duration-300 max-h-[90vh] overflow-y-auto no-scrollbar">
            <div class="p-6 border-b-4 border-dark flex justify-between items-center bg-primary">
                <h3 id="modal-title" class="text-2xl font-display font-bold text-dark uppercase tracking-widest">Añadir
                    Producto</h3>
                <button type="button"
                    class="admin-modal-close text-dark hover:text-white p-2 border-2 border-transparent hover:border-dark">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <form id="product-form" class="p-8 space-y-6">
                <input type="hidden" id="prod-id">
                <input type="hidden" id="prod-url-imagen-actual">

                <div>
                    <label class="block text-sm font-bold text-dark mb-2 font-display uppercase tracking-widest">Nombre
                        del Ejemplar</label>
                    <input type="text" id="prod-nombre"
                        class="w-full px-4 py-3 border-4 border-dark bg-white focus:outline-none shadow-brutal-sm"
                        required>
                </div>

                <div>
                    <label
                        class="block text-sm font-bold text-dark mb-2 font-display uppercase tracking-widest">Descripción
                        Táctica</label>
                    <textarea id="prod-descripcion"
                        class="w-full px-4 py-3 border-4 border-dark bg-white focus:outline-none shadow-brutal-sm"
                        rows="3" required></textarea>
                </div>

                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label
                            class="block text-sm font-bold text-dark mb-2 font-display uppercase tracking-widest">Valor
                            ($)</label>
                        <input type="number" step="0.01" id="prod-precio"
                            class="w-full px-4 py-3 border-4 border-dark bg-white focus:outline-none shadow-brutal-sm"
                            required>
                    </div>
                    <div>
                        <label
                            class="block text-sm font-bold text-dark mb-2 font-display uppercase tracking-widest">División</label>
                        <select id="prod-categoria"
                            class="w-full px-4 py-3 border-4 border-dark bg-white focus:outline-none shadow-brutal-sm appearance-none"
                            required>
                            <option value="Combos">Combos</option>
                            <option value="Carnes">Carnes</option>
                            <option value="Bebidas">Bebidas</option>
                            <option value="Adicionales">Adicionales</option>
                            <option value="Postres">Postres</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-dark mb-2 font-display uppercase tracking-widest">Archivo
                        Visual</label>
                    <input type="file" id="prod-imagen"
                        class="w-full text-sm font-bold file:mr-4 file:py-3 file:px-6 file:border-4 file:border-dark file:bg-secondary file:text-dark hover:file:bg-primary hover:file:text-white file:transition-colors file:font-display file:uppercase file:cursor-pointer shadow-brutal-sm bg-white"
                        accept="image/*">
                    <p id="upload-status" class="text-sm font-bold text-primary mt-2"></p>
                </div>

                <div class="flex gap-8 mt-6">
                    <label class="flex items-center gap-3 cursor-pointer">
                        <input type="checkbox" id="prod-activo"
                            class="w-6 h-6 border-4 border-dark text-primary focus:ring-0 checked:bg-primary" checked>
                        <span class="text-lg font-bold font-display uppercase">Operativo</span>
                    </label>
                    <label class="flex items-center gap-3 cursor-pointer">
                        <input type="checkbox" id="prod-destacado"
                            class="w-6 h-6 border-4 border-dark text-secondary focus:ring-0 checked:bg-secondary">
                        <span class="text-lg font-bold font-display uppercase">Élite (Destacado)</span>
                    </label>
                </div>

                <div class="pt-6 border-t-4 border-dark flex justify-end gap-4">
                    <button type="button"
                        class="admin-modal-close bg-white border-4 border-dark px-6 py-3 font-display text-xl uppercase font-bold hover:bg-dark hover:text-white transition-colors">Cancelar</button>
                    <button type="submit" id="save-product-btn"
                        class="bg-primary text-white border-4 border-dark px-8 py-3 font-display text-xl uppercase font-bold shadow-brutal hover:shadow-none hover:translate-x-1 hover:translate-y-1 transition-all">Desplegar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts: SDK Supabase + Lógica Admin -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabaseClient.js"></script>
    <script src="/js/admin.js"></script>
</body>

</html>
